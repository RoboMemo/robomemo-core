# ============================================================
# RoboMemo NGINX — Main Configuration
# GeoIP WAF + TLS 1.3 + Reverse Proxy
# ============================================================

# Load GeoIP2 module (install: apt-get install libnginx-mod-http-geoip2)
# load_module modules/ngx_http_geoip2_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'geo=$geoip2_country_code';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 500m;  # Large video uploads

    # GeoIP2 — MaxMind database
    # Download from: https://dev.maxmind.com/geoip/geoip2/geolite2/
    # geoip2 /etc/nginx/GeoIP/GeoLite2-Country.mmdb {
    #     auto_reload 24h;
    #     $geoip2_country_code source=$remote_addr country iso_code;
    # }

    # For dev/testing without GeoIP module, use a simple map
    # In production, uncomment the geoip2 block above
    geo $blocked_country {
        default         0;
        # China IP ranges (sample — use MaxMind for full list)
        1.0.1.0/24      1;
        1.0.2.0/23      1;
        # Hong Kong ranges
        # Add full list via MaxMind GeoIP2
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=vlm:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    include /etc/nginx/conf.d/*.conf;
}
