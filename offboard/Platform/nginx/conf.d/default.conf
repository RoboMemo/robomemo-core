# ============================================================
# RoboMemo — NGINX Server Block
# TLS 1.3 + Geo-Fence + Reverse Proxy to App
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name platform.robomemo.io api.robomemo.io;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name platform.robomemo.io api.robomemo.io;

    # ─── TLS 1.3 Configuration ─────────────────────────────
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_certificate     /etc/ssl/robomemo/fullchain.pem;
    ssl_certificate_key /etc/ssl/robomemo/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # ─── Geo-Fence: Block China & Hong Kong ─────────────────
    if ($blocked_country) {
        return 403 '{"error":"Access denied","reason":"GEOGRAPHIC_RESTRICTION"}';
    }

    # ─── API Endpoints (reverse proxy to Node.js) ───────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass geo info to app for secondary check
        # proxy_set_header X-Geo-Country $geoip2_country_code;

        # Timeouts for VLM analysis (can take 60s+)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # VLM endpoints — stricter rate limit
    location /api/vlm/ {
        limit_req zone=vlm burst=3 nodelay;

        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Auth endpoints — rate limited
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Static Frontend (SPA) ──────────────────────────────
    location / {
        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        try_files $uri $uri/ /index.html;
    }

    # ─── Uploaded frames (static) ────────────────────────────
    location /uploads/ {
        proxy_pass http://app:3001/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /api/health {
        proxy_pass http://app:3001/api/health;
        access_log off;
    }
}
